name: Feature Request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature!
  
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
  
  - type: dropdown
    id: importance
    attributes:
      label: How important is this feature to you?
      options:
        - Critical - I cannot use the tool without it
        - High - It would significantly improve my workflow
        - Medium - It would be nice to have
        - Low - Minor improvement
    validations:
      required: true
  
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Please provide a specific example of how you would use this feature
      placeholder: |
        When working on X, I need to Y because Z...
    validations:
      required: true
  
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context, mockups, or examples about the feature request here.
  
  - type: checkboxes
    id: contribution
    attributes:
      label: Are you willing to help implement this feature?
      options:
        - label: Yes, I can submit a PR
        - label: Yes, but I would need guidance
        - label: No, but I can help test it